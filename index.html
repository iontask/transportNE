    <script>
      (function () {
        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var currentFetch = originalFetch;

          // Ensure window.fetch has both a getter and a setter so external scripts or polyfills
          // attempting to assign window.fetch do not throw "Cannot set property fetch of #<Window> which has only a getter"
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return currentFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // If property cannot be redefined, suppress the specific uncaught TypeError
        }

        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.includes('fetch') && event.message.includes('getter')) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
